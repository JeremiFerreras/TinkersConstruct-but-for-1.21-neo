pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Neo Mantle is the 1.21.1 Mantle port required by this Tinkers' Construct port.
// Keep the dependency pinned as a Git submodule so CI and local builds use the same API.
if (!file('neomantle/settings.gradle').exists()) {
    throw new GradleException("Missing Neo Mantle submodule. Run: git submodule update --init --recursive")
}

includeBuild('neomantle') {
    dependencySubstitution {
        substitute module('slimeknights.mantle:Mantle') using project(':')
    }
}

rootProject.name = 'TConstruct'
