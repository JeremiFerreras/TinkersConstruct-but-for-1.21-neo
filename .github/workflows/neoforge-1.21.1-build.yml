name: NeoForge 1.21.1 Build

on:
  push:
    branches:
      - "work/**"
      - "port/**"
  pull_request:
    branches:
      - "1.20.1"
      - "port/neoforge-1.21.1"
  workflow_dispatch:

concurrency:
  group: neoforge-1.21.1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        shell: bash
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.21.1-build-diagnostics
          path: |
            build.log
            build/reports/
            build/test-results/
          if-no-files-found: ignore

      - name: Upload playable mod
        uses: actions/upload-artifact@v4
        with:
          name: NeoTinkers-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Test packaged mod on a dedicated server
        timeout-minutes: 12
        shell: bash
        run: |
          set -eu
          mkdir -p smoke/mods
          cp "$(find build/libs -name '*.jar' ! -name '*-sources.jar' -print -quit)" smoke/mods/
          cd smoke
          curl --fail --location --retry 3 https://github.com/vancevoj/neomantle/releases/download/v1.28/NeoMantle-1.21.1-1.21.0-v1.28.jar -o mods/NeoMantle.jar
          curl --fail --location --retry 3 https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.266/neoforge-21.1.266-installer.jar -o installer.jar
          java -jar installer.jar --installServer
          python ../.github/tests/server-smoke.py

      - name: Upload dedicated server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-logs
          path: smoke/logs
