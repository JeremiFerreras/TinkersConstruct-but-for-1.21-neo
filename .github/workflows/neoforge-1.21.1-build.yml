name: NeoForge 1.21.1 Build

on:
  push:
    branches:
      - "work/**"
      - "port/**"
  pull_request:
    branches:
      - "1.20.1"
      - "port/neoforge-1.21.1"
  workflow_dispatch:

concurrency:
  group: neoforge-1.21.1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        shell: bash
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.21.1-build-diagnostics
          path: |
            build.log
            build/reports/
            build/test-results/
          if-no-files-found: ignore
